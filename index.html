<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inducción · Adultos Voluntarios Nuevos</title>
<style>
  :root {
    --purple: #4d006e;
    --purple-dark: #34004b;
    --blue: #003087;
    --lilac: #efe4f5;
    --lilac-soft: #f7f4fa;
    --ink: #222228;
    --muted: #687082;
    --line: #e5dcec;
    --ok: #219653;
    --warn: #b4690e;
    --radius: 16px;
    --shadow: 0 10px 28px rgba(77, 0, 110, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--lilac-soft);
    color: var(--ink);
    padding: 24px;
  }

  .ind-wrap {
    max-width: 1180px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .ind-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 18px;
  }

  .ind-header h2 {
    margin: 4px 0 6px;
    color: var(--purple);
    font-size: 1.4rem;
    font-weight: 900;
  }

  .ind-sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 800;
    background: var(--lilac);
    color: var(--purple);
  }

  .pill.ok { background: #e6f6ed; color: #166534; }
  .pill.warn { background: #fff4cc; color: #7a5800; }

  .progress-box {
    background: var(--lilac-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 0.88rem;
    font-weight: 800;
  }

  .progress-track {
    width: 100%;
    height: 12px;
    background: #e6dcf0;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--ok));
    transition: width 0.25s ease;
  }

  .ind-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  button, input, select {
    font: inherit;
  }

  .btn {
    border: 0;
    border-radius: 12px;
    padding: 0.65rem 1rem;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    background: var(--purple);
    color: #fff;
  }

  .btn:hover { background: var(--purple-dark); }
  .btn.secondary {
    background: #fff;
    color: var(--purple);
    border: 1px solid var(--line);
  }
  .btn.secondary.active {
    background: var(--lilac);
    border-color: var(--purple);
  }
  .btn.danger {
    background: #ffe8ec;
    color: #9e112b;
  }

  .step-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    background: #fff;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .step-card.verified {
    border-color: #9bd8b4;
    background: #f9fefb;
  }

  .step-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
  }

  .check-label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    font-weight: 900;
    color: var(--purple);
    font-size: 1rem;
  }

  .check-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: var(--ok);
    cursor: pointer;
    flex-shrink: 0;
  }

  .step-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .step-desc {
    margin: 10px 0 10px 32px;
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .step-links {
    margin: 0 0 14px 32px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.84rem;
  }

  .step-links a {
    color: var(--blue);
    font-weight: 700;
    word-break: break-all;
  }

  .verify-grid {
    margin-left: 32px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
    background: var(--lilac-soft);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
  }

  .v-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .v-field label {
    font-size: 0.75rem;
    font-weight: 800;
    color: #3b3440;
  }

  .v-field input, .v-field select {
    border: 1px solid #d7c7e4;
    border-radius: 10px;
    padding: 0.5rem 0.65rem;
    font-size: 0.83rem;
    background: #fff;
    color: var(--ink);
  }

  .verify-hint {
    margin: 8px 0 0 32px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .step-desc, .step-links, .verify-grid, .verify-hint { margin-left: 0; }
    .step-top { flex-direction: column; }
  }
</style>
</head>
<body>

<section id="seccionInduccion" class="ind-wrap">
  <div class="ind-header">
    <div>
      <span class="pill">SCOUTS COLOMBIA · CHECKLIST OFICIAL</span>
      <h2>Fase de Inducción — Adultos Voluntarios Nuevos</h2>
      <p class="ind-sub">Registro y verificación de cumplimiento paso a paso para cada nuevo adulto voluntario.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" class="btn secondary" onclick="exportInductionSummary()">Exportar Resumen</button>
      <button type="button" class="btn danger" onclick="resetInductionProgress()">Reiniciar Verificación</button>
    </div>
  </div>

  <div class="progress-box">
    <div class="progress-top">
      <span id="indProgressText">Verificados: 0 de 9 pasos (0%)</span>
      <span id="indReadyBadge" class="pill warn">En proceso de inducción</span>
    </div>
    <div class="progress-track">
      <div id="indProgressFill" class="progress-fill"></div>
    </div>
  </div>

  <div class="ind-filters">
    <button type="button" class="btn secondary active" data-filter="all" onclick="setIndFilter('all', this)">Todos</button>
    <button type="button" class="btn secondary" data-filter="pending" onclick="setIndFilter('pending', this)">Pendientes</button>
    <button type="button" class="btn secondary" data-filter="verified" onclick="setIndFilter('verified', this)">Verificados</button>
  </div>

  <div id="inductionChecklistContainer"></div>
</section>

<script>
  const INDUCTION_STORAGE_KEY = 'scouts_fase_induccion_verificable_v1';

  const INDUCTION_STEPS = [
    {
      id: 'talento_360',
      paso: 'Paso 1',
      titulo: 'Registrar la hoja de vida en la plataforma Talento 360',
      plataforma: 'TCNScout / Talento 360',
      descripcion: 'Ingresar a la plataforma Talento 360 para diligenciar la hoja de vida en todos sus campos e incluir fotografía.',
      enlaces: [],
      evidenciaSugerida: 'Captura o confirmación de perfil completo y foto en Talento 360'
    },
    {
      id: 'compromiso_mutuo',
      paso: 'Paso 2',
      titulo: 'Estar al día con los documentos relacionados al compromiso mutuo',
      plataforma: 'Documentos #7, #8, #10',
      descripcion: 'Diligenciar el Compromiso acuerdo mutuo - servicio voluntario; registrar el compromiso de ingreso del adulto (solicitud de registro e inscripción acuerdo mutuo); y contar con nombramiento oficial por parte del jefe inmediato.',
      enlaces: [
        { label: 'Carpeta de documentos (Drive)', url: 'https://drive.google.com/drive/folders/1mWyQci5zHhiURd7IAIPKkx187MAobDR' }
      ],
      evidenciaSugerida: 'Radicado o archivo firmado de acuerdo mutuo y nombramiento'
    },
    {
      id: 'siscout',
      paso: 'Paso 3',
      titulo: 'Inscripción en la plataforma SISCOUT',
      plataforma: 'Siscout',
      descripcion: 'Completar el registro en la plataforma habilitada por la Asociación Scouts de Colombia.',
      enlaces: [],
      evidenciaSugerida: 'Código o estado activo de inscripción en SISCOUT'
    },
    {
      id: 'manual_cargos',
      paso: 'Paso 4',
      titulo: 'Leer el manual de cargos, perfiles y funciones por competencias',
      plataforma: 'Documento #4',
      descripcion: 'Leer y entender el manual de cargos, perfiles y funciones por competencias esperadas para el cargo a desarrollar.',
      enlaces: [
        { label: 'Carpeta Manual / Documentos (Drive)', url: 'https://drive.google.com/drive/folders/1mWyQci5zHhiURd7IAIPKkx187MAobDR' }
      ],
      evidenciaSugerida: 'Constancia de lectura o validación con el jefe inmediato'
    },
    {
      id: 'induccion_general',
      paso: 'Paso 5',
      titulo: 'Realizar el curso de inducción general',
      plataforma: 'UniversidadScout - Colombia',
      descripcion: 'Hacer el curso de inducción general en la Plataforma Universidad Scout, descargar el certificado y entregarlo al jefe inmediato.',
      enlaces: [],
      evidenciaSugerida: 'Nombre/código del certificado entregado al jefe inmediato'
    },
    {
      id: 'cursos_sfh',
      paso: 'Paso 6',
      titulo: 'Realizar los cursos SFH (A salvo del peligro)',
      plataforma: '4 cursos habilitados',
      descripcion: 'Hacer los 4 cursos habilitados de A salvo del peligro (SFH 1 Safe from Harm Essential Learnings, SfH 2b WOSM Safe from Harm Procedures, SfH 3 Estar seguro en línea y módulo habilitado), descargar los certificados y entregarlos al jefe inmediato.',
      enlaces: [
        { label: 'SFH 1 - Safe from Harm Essential Learnings', url: 'https://learn.scout.org/resource/sfh-1-safe-harm-essential-learnings' },
        { label: 'Curso SFH / E-learning habilitado', url: 'https://elearning.easy.generator.com/28721976-31f9-45ea-bf7e-d46d7bf1c88d/#/login' }
      ],
      evidenciaSugerida: 'Certificados de los 4 cursos descargados y entregados'
    },
    {
      id: 'asesor_personal',
      paso: 'Paso 7',
      titulo: 'Escoger un asesor personal',
      plataforma: 'Documento #26',
      descripcion: 'Solicitar que todos los adultos que están ingresando tengan un asesor personal para apoyar el desarrollo de sus competencias junto con el formato de aval de aceptación de asesoría firmado (enviar al jefe inmediato).',
      enlaces: [
        { label: 'Carpeta de formatos / Documento #26 (Drive)', url: 'https://drive.google.com/drive/folders/1mWyQci5zHhiURd7|APKkx187MAobDR' }
      ],
      evidenciaSugerida: 'Nombre del asesor asignado y formato #26 firmado'
    },
    {
      id: 'valoracion_inicial',
      paso: 'Paso 8',
      titulo: 'Realizar la valoración inicial por competencias',
      plataforma: 'Talento 360 · Evaluación #1',
      descripcion: 'Agendar al asesor personal para la primera reunión de acercamiento para revisar la valoración inicial de las competencias e iniciar el Plan Personal de Desarrollo. Crear la valoración (Evaluación #1) en Talento 360, motivar el diligenciamiento por parte del equipo y hacer seguimiento a los resultados.',
      enlaces: [],
      evidenciaSugerida: 'Fecha de reunión de acercamiento, inicio PPD y seguimiento Evaluación #1'
    },
    {
      id: 'seguimiento_3_meses',
      paso: 'Paso 9',
      titulo: 'Seguimiento y acompañamiento del adulto durante el periodo de inducción',
      plataforma: 'HRMScouts · 3 primeros meses',
      descripcion: 'Acompañar al adulto nuevo durante los 3 primeros meses, donde el jefe inmediato hará seguimiento a las acciones puntuales, aclarará inquietudes y al finalizar este periodo realizará una retroalimentación de acuerdo con el desempeño y las recomendaciones del asesor personal.',
      enlaces: [],
      evidenciaSugerida: 'Acta o registro de retroalimentación al cierre de los 3 meses'
    }
  ];

  let indFilter = 'all';
  let indState = loadInductionState();

  function loadInductionState() {
    try {
      const raw = localStorage.getItem(INDUCTION_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch {
      return {};
    }
  }

  function saveInductionState() {
    localStorage.setItem(INDUCTION_STORAGE_KEY, JSON.stringify(indState));
  }

  function getStepData(id) {
    return indState[id] || {
      checked: false,
      evidencia: '',
      fechaVerificacion: '',
      verificadoPor: 'Jefe inmediato'
    };
  }

  function isStepVerified(id) {
    const d = getStepData(id);
    return Boolean(d.checked && d.evidencia.trim() && d.fechaVerificacion);
  }

  function updateStepField(id, field, value) {
    const current = getStepData(id);
    indState[id] = { ...current, [field]: value };
    saveInductionState();
    renderInduction();
  }

  function setIndFilter(filter, btn) {
    indFilter = filter;
    document.querySelectorAll('.ind-filters .btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderInduction();
  }

  function resetInductionProgress() {
    if (!confirm('¿Deseas borrar todos los registros de verificación de inducción?')) return;
    indState = {};
    saveInductionState();
    renderInduction();
  }

  function exportInductionSummary() {
    const lines = ['FASE DE INDUCCIÓN - ADULTOS VOLUNTARIOS NUEVOS', ''];
    INDUCTION_STEPS.forEach((step, idx) => {
      const d = getStepData(step.id);
      const ok = isStepVerified(step.id);
      lines.push(`${idx + 1}. ${step.titulo} [${ok ? 'VERIFICADO' : 'PENDIENTE'}]`);
      lines.push(`   Marcado: ${d.checked ? 'Sí' : 'No'} | Fecha: ${d.fechaVerificacion || 'N/A'} | Validador: ${d.verificadoPor || 'N/A'}`);
      lines.push(`   Soporte/Evidencia: ${d.evidencia || 'Sin registrar'}`);
      lines.push('');
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'verificacion_induccion_adultos.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function escapeAttr(str) {
    return String(str ?? '').replace(/&/g, '&').replace(/"/g, '"').replace(/</g, '<').replace(/>/g, '>');
  }

  function renderInduction() {
    const container = document.getElementById('inductionChecklistContainer');
    const total = INDUCTION_STEPS.length;
    const verifiedCount = INDUCTION_STEPS.filter(s => isStepVerified(s.id)).length;
    const pct = Math.round((verifiedCount / total) * 100);

    document.getElementById('indProgressText').textContent = `Verificados: ${verifiedCount} de ${total} pasos (${pct}%)`;
    document.getElementById('indProgressFill').style.width = `${pct}%`;

    const badge = document.getElementById('indReadyBadge');
    if (verifiedCount === total) {
      badge.textContent = 'Inducción completa y verificada';
      badge.className = 'pill ok';
    } else {
      badge.textContent = `${total - verifiedCount} por verificar`;
      badge.className = 'pill warn';
    }

    const visibleSteps = INDUCTION_STEPS.filter(step => {
      const verified = isStepVerified(step.id);
      if (indFilter === 'verified') return verified;
      if (indFilter === 'pending') return !verified;
      return true;
    });

    if (!visibleSteps.length) {
      container.innerHTML = '<p class="ind-sub" style="padding:16px 0;">No hay pasos en este filtro.</p>';
      return;
    }

    container.innerHTML = visibleSteps.map(step => {
      const d = getStepData(step.id);
      const verified = isStepVerified(step.id);

      let statusPill = '<span class="pill warn">Pendiente</span>';
      if (verified) {
        statusPill = '<span class="pill ok">Verificado</span>';
      } else if (d.checked) {
        statusPill = '<span class="pill">Falta soporte o fecha</span>';
      }

      const linksHtml = step.enlaces.length
        ? `<div class="step-links">${step.enlaces.map(l => `<a href="${escapeAttr(l.url)}" target="_blank" rel="noopener noreferrer">${escapeAttr(l.label)}</a>`).join('')}</div>`
        : '';

      return `
        <article class="step-card ${verified ? 'verified' : ''}">
          <div class="step-top">
            <label class="check-label">
              <input type="checkbox" ${d.checked ? 'checked' : ''} onchange="updateStepField('${step.id}', 'checked', this.checked)" />
              <span>${escapeAttr(step.paso)}: ${escapeAttr(step.titulo)}</span>
            </label>
            <div class="step-meta">
              <span class="pill">${escapeAttr(step.plataforma)}</span>
              ${statusPill}
            </div>
          </div>

          <p class="step-desc">${escapeAttr(step.descripcion)}</p>
          ${linksHtml}

          <div class="verify-grid">
            <div class="v-field">
              <label>Soporte / Evidencia verificable *</label>
              <input type="text" value="${escapeAttr(d.evidencia)}" placeholder="${escapeAttr(step.evidenciaSugerida)}" oninput="updateStepField('${step.id}', 'evidencia', this.value)" />
            </div>
            <div class="v-field">
              <label>Fecha de verificación *</label>
              <input type="date" value="${escapeAttr(d.fechaVerificacion)}" onchange="updateStepField('${step.id}', 'fechaVerificacion', this.value)" />
            </div>
            <div class="v-field">
              <label>Validado por</label>
              <select onchange="updateStepField('${step.id}', 'verificadoPor', this.value)">
                <option value="Jefe inmediato" ${d.verificadoPor === 'Jefe inmediato' ? 'selected' : ''}>Jefe inmediato</option>
                <option value="Asesor personal" ${d.verificadoPor === 'Asesor personal' ? 'selected' : ''}>Asesor personal</option>
                <option value="Adulto nuevo" ${d.verificadoPor === 'Adulto nuevo' ? 'selected' : ''}>Adulto nuevo</option>
              </select>
            </div>
          </div>

          <p class="verify-hint">Para quedar como <strong>Verificado</strong>, debe estar marcado, tener soporte/evidencia y fecha de verificación.</p>
        </article>
      `;
    }).join('');
  }

  renderInduction();
</script>
</body>
</html>

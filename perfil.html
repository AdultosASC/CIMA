<div id="perfil-cargo-wrapper" data-role="clan">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <div>
            <div class="profile-name-clean" id="v-nombre">MAURICIO QUIROGA POSADA</div>
            <p id="v-cargo-subtitulo" style="margin-bottom: 0;">Dirigente activo - Subjefe de Clan (Nivel Grupo)</p>
        </div>

        <div id="acciones-por-cargo" style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="button" class="btn-action" onclick="descargarHVScout()">
                <i class="fa-solid fa-download"></i> Descargar HV Scout
            </button>

            <!-- Opción visible solo cuando el cargo es Director de Adultos -->
            <button type="button" class="btn-action" id="btn-opcion-director" style="display: none;" onclick="abrirGestionNacional()">
                <i class="fa-solid fa-sliders"></i> Gestión Nacional de Adultos
            </button>

            <!-- Opción visible solo cuando el cargo es Subjefe de Clan -->
            <button type="button" class="btn-action" id="btn-opcion-subjefe" onclick="abrirSeguimientoRama()">
                <i class="fa-solid fa-users"></i> Seguimiento de Rama
            </button>
        </div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-chart-pie"></i> Balanced Scorecard (BSC) - <span id="bsc-title-cargo">Subjefe de Clan</span></h3>
        <p id="bsc-descripcion-cargo">Indicadores clave asociados al cargo activo.</p>
        <div class="bsc-grid" id="bsc-content"></div>
    </div>
</div>

<script>
    const BSC_POR_CARGO = {
        clan: {
            tituloCargo: 'Subjefe de Clan',
            subtituloPerfil: 'Dirigente activo - Subjefe de Clan (Nivel Grupo)',
            descripcion: 'Indicadores de gestión de rama, formación y desarrollo personal.',
            cards: [
                { icon: 'fa-graduation-cap', title: 'Cursos Realizados', value: '5 Módulos', subtext: 'Rama Rovers y Básica' },
                { icon: 'fa-award', title: 'Nivel Formación', value: 'Ins. de Madera', subtext: 'Acreditado / Vigente' },
                { icon: 'fa-clock-rotate-left', title: 'Horas de Servicio', value: '95 hrs', subtext: 'Actividades de Grupo' },
                { icon: 'fa-clipboard-check', title: 'Cumplimiento PPD', value: '94%', subtext: 'Plan Personal de Desarrollo' }
            ]
        },
        nacion: {
            tituloCargo: 'Director de Adultos',
            subtituloPerfil: 'Dirigente activo - Director de Adultos (Nivel Nación)',
            descripcion: 'Indicadores estratégicos, liderazgo nacional y seguimiento del plan de adultos.',
            cards: [
                { icon: 'fa-graduation-cap', title: 'Cursos Realizados', value: '12 Cursos', subtext: 'Gestión y Liderazgo Avanzado' },
                { icon: 'fa-award', title: 'Nivel Formación', value: 'Gestor Nacional', subtext: '4 Maderos (GN)' },
                { icon: 'fa-clock-rotate-left', title: 'Horas Gestión', value: '350 hrs', subtext: 'Equipo Nacional' },
                { icon: 'fa-clipboard-check', title: 'Cumplimiento PPD', value: '98%', subtext: 'Plan Personal de Desarrollo' }
            ]
        }
    };

    function aplicarOpcionesPorCargo(roleKey) {
        const cargoNormalizado = (roleKey === 'nacion') ? 'nacion' : 'clan';
        const config = BSC_POR_CARGO[cargoNormalizado];

        const wrapper = document.getElementById('perfil-cargo-wrapper');
        if (wrapper) wrapper.setAttribute('data-role', cargoNormalizado);

        document.getElementById('v-cargo-subtitulo').innerText = config.subtituloPerfil;
        document.getElementById('bsc-title-cargo').innerText = config.tituloCargo;
        document.getElementById('bsc-descripcion-cargo').innerText = config.descripcion;

        // Mostrar u ocultar opciones específicas según el cargo
        const btnDirector = document.getElementById('btn-opcion-director');
        const btnSubjefe = document.getElementById('btn-opcion-subjefe');

        if (cargoNormalizado === 'nacion') {
            if (btnDirector) btnDirector.style.display = 'inline-flex';
            if (btnSubjefe) btnSubjefe.style.display = 'none';
        } else {
            if (btnDirector) btnDirector.style.display = 'none';
            if (btnSubjefe) btnSubjefe.style.display = 'inline-flex';
        }

        const container = document.getElementById('bsc-content');
        if (container) {
            container.innerHTML = config.cards.map(card => `
                <div class="bsc-card">
                    <i class="fa-solid ${card.icon}"></i>
                    <h4>${card.title}</h4>
                    <div class="bsc-value">${card.value}</div>
                    <div class="bsc-subtext">${card.subtext}</div>
                </div>
            `).join('');
        }
    }

    function descargarHVScout() {
        alert('Descargando Hoja de Vida Scout completa desde Talento360°...');
    }

    function abrirGestionNacional() {
        alert('Abriendo opciones exclusivas del perfil Director de Adultos.');
    }

    function abrirSeguimientoRama() {
        alert('Abriendo opciones exclusivas del perfil Subjefe de Clan.');
    }

    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'CIMA_ROLE_CHANGE') {
            aplicarOpcionesPorCargo(event.data.roleKey);
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        let rolInicial = 'clan';
        try {
            const guardado = JSON.parse(localStorage.getItem('cima_active_role_state') || '{}');
            if (guardado && guardado.roleKey) rolInicial = guardado.roleKey;
            else if (guardado && guardado.key) rolInicial = guardado.key;
        } catch (e) {}
        aplicarOpcionesPorCargo(rolInicial);
    });
</script>
